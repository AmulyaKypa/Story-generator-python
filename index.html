<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Weaver (Client/Server)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use Inter Font and ensure full-screen, responsive layout */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Stylish background gradient */
            background: linear-gradient(135deg, #0f172a, #1e293b); 
        }
        /* Custom scrollbar for output area (optional aesthetic touch) */
        #story-output::-webkit-scrollbar {
            width: 6px;
        }
        #story-output::-webkit-scrollbar-thumb {
            background-color: #4f46e5;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="app-container" class="w-full max-w-5xl p-6 md:p-10 bg-gray-900 shadow-2xl rounded-2xl border border-indigo-700">
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 mb-3">
                AI Story Weaver
            </h1>
            <p class="text-gray-400 text-lg">
                Craft a narrative using your running Python server.
            </p>
            <p id="api-status" class="text-sm mt-4 text-green-400 font-semibold">Ready to generate.</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-5 gap-8">
            
            <div id="input-section" class="md:col-span-2 space-y-6 p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-700">
                <h2 class="text-xl font-bold text-white border-b border-purple-600 pb-2 mb-4">
                    Story Parameters
                </h2>

                <div class="space-y-2">
                    <label for="genre" class="block text-sm font-medium text-gray-300">Genre (e.g., Sci-Fi, Horror):</label>
                    <input type="text" id="genre" value="Fantasy"
                           class="w-full p-3 border border-gray-600 rounded-lg bg-gray-700 text-white placeholder-gray-500 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                           placeholder="Adventure" required>
                </div>

                <div class="space-y-2">
                    <label for="paragraphs" class="block text-sm font-medium text-gray-300">Number of Paragraphs (1-5):</label>
                    <input type="number" id="paragraphs" value="3" min="1" max="5"
                           class="w-full p-3 border border-gray-600 rounded-lg bg-gray-700 text-white placeholder-gray-500 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                           required>
                </div>

                <div class="space-y-2">
                    <label for="keywords" class="block text-sm font-medium text-gray-300">Keywords (Comma Separated):</label>
                    <textarea id="keywords" rows="3"
                           class="w-full p-3 border border-gray-600 rounded-lg bg-gray-700 text-white placeholder-gray-500 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                           placeholder="a magic sword, ancient ruins, a loyal companion" required></textarea>
                </div>

                <button id="generate-btn" 
                        class="w-full py-3 px-4 mt-6 rounded-xl text-white font-bold text-lg transition duration-300 
                               bg-indigo-600 hover:bg-indigo-500 shadow-xl shadow-indigo-900/50 hover:shadow-indigo-900/80 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                    Generate Story
                </button>
            </div>
            
            <div id="output-section" class="md:col-span-3 p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-700 flex flex-col hidden">
                <h2 class="text-xl font-bold text-white border-b border-teal-500 pb-2 mb-4">
                    Generated Story
                </h2>
                <div id="story-output" class="flex-grow h-96 overflow-y-auto p-4 bg-gray-700 rounded-lg text-gray-200 text-base leading-relaxed whitespace-pre-wrap transition duration-300">
                    </div>
            </div>

            <div id="loading-indicator" class="col-span-1 md:col-span-5 text-center py-10 hidden">
                <div class="animate-pulse">
                    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-500 mx-auto"></div>
                    <p class="text-purple-400 mt-4 text-xl font-medium">Summoning the Muse...</p>
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- API Configuration: Target the Flask server ---
        // This is the endpoint defined in story_generator.py
        const FLASK_API_URL = 'http://127.0.0.1:5000/generate_story'; 

        // --- DOM Elements ---
        const generateBtn = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        const storyOutput = document.getElementById('story-output');
        const loadingIndicator = document.getElementById('loading-indicator');
        const apiStatus = document.getElementById('api-status');
        
        generateBtn.addEventListener('click', generateStory);


        async function generateStory() {
            // 1. Get user inputs and validate (client-side validation for speed)
            const genre = document.getElementById('genre').value.trim();
            const paragraphs = parseInt(document.getElementById('paragraphs').value.trim());
            const keywords = document.getElementById('keywords').value.trim();

            if (!genre || !keywords || isNaN(paragraphs) || paragraphs <= 0 || paragraphs > 5) {
                storyOutput.textContent = "Please ensure the genre and keywords are filled, and paragraphs is a number between 1 and 5.";
                outputSection.classList.remove('hidden');
                apiStatus.textContent = "Validation Error.";
                apiStatus.className = 'text-sm mt-4 text-red-400 font-semibold';
                return;
            }

            // 2. Prepare UI for loading
            outputSection.classList.add('hidden'); // Hide output until we have results
            loadingIndicator.classList.remove('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            storyOutput.textContent = '';
            apiStatus.className = 'text-sm mt-4 text-indigo-400 font-semibold';
            apiStatus.textContent = "Sending request to Python server...";

            try {
                // 3. Make HTTP request to the Flask backend
                const response = await fetch(FLASK_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        genre: genre,
                        paragraphs: paragraphs,
                        keywords: keywords
                    })
                });

                const result = await response.json();
                
                // 4. Handle response from Flask
                outputSection.classList.remove('hidden');

                if (response.ok && result.success) {
                    storyOutput.textContent = result.story;
                    apiStatus.textContent = "Story successfully retrieved from Python server!";
                    apiStatus.className = 'text-sm mt-4 text-green-400 font-semibold';
                } else {
                    // Handles errors sent back by the Flask server (e.g., failed API call)
                    const errorMsg = result.error || result.story || "Unknown error from server.";
                    storyOutput.textContent = `Error: ${errorMsg}`;
                    apiStatus.textContent = "Generation failed due to Server or API error.";
                    apiStatus.className = 'text-sm mt-4 text-red-400 font-semibold';
                }

            } catch (error) {
                // Handles network or connection errors (e.g., Flask server is not running)
                outputSection.classList.remove('hidden');
                storyOutput.textContent = `Connection Failed: Could not reach the Python server at ${FLASK_API_URL}. Please ensure your 'story_generator.py' is running. Error detail: ${error.message}`;
                apiStatus.textContent = "Connection failed! Is the Flask server running?";
                apiStatus.className = 'text-sm mt-4 text-red-400 font-semibold';
            } finally {
                // 5. Reset UI state
                loadingIndicator.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Initial visibility setup and warning
        window.onload = () => {
             outputSection.classList.add('hidden');
             apiStatus.textContent = "REMINDER: Start your Python server ('export FLASK_APP=story_generator.py && flask run') before clicking 'Generate Story'.";
             apiStatus.className = 'text-sm mt-4 text-yellow-400 font-semibold';
        };

    </script>
</body>
</html>
